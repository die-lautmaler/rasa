# Simple Wandb Sweep Configuration
# Compatible with the new auto-sweep functionality

project: rasa-simple-sweep
method: bayes

# Metric to optimize
metric:
  goal: minimize
  name: validation/total_loss

# Optional: limit number of runs
run_count: 10

# Simple hyperparameters to sweep
parameters:
  epochs:
    values: [50, 100, 200]
    
  learning_rate:
    min: 0.001
    max: 0.01
    distribution: log_uniform_values
    
  batch_size:
    values: [[32, 128], [64, 256]]
    
  transformer_size:
    values: [128, 256, 512]
    
  early_stopping_patience:
    values: [10, 15, 20]