# Example wandb sweep configuration for Rasa hyperparameter optimization
# Usage: wandb sweep example_sweep_config.yaml

project: rasa-hyperparameter-optimization
entity: your-wandb-entity  # Optional: replace with your wandb entity

# Optimization method
method: bayes  # Options: bayes, grid, random

# Metric to optimize
metric:
  goal: maximize  # or minimize
  name: train/entity_f1_score  # Metric name as logged by Rasa

# Early termination (optional)
early_terminate:
  type: hyperband
  min_iter: 10

# Hyperparameters to sweep over
parameters:
  # DIET Classifier parameters
  diet_epochs:
    values: [25, 50, 100]
    
  diet_learning_rate:
    min: 0.00005
    max: 0.01
    distribution: log_uniform_values
    
  diet_transformer_size:
    values: [64, 128, 256, 512]
    
  diet_num_transformer_layers:
    values: [1, 2, 3]
    
  diet_num_heads:
    values: [2, 4, 6]
    
  diet_drop_rate:
    min: 0.0
    max: 0.5
    distribution: uniform

# Run configuration
name: rasa-diet-optimization
description: "Optimizing DIET classifier hyperparameters for better performance"

# Optional: Command to run (if using wandb agent directly)
# program: sweep_runner.py